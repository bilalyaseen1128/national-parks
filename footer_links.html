<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Parks History</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<style>
  body {
    background-color: #12311f;
    margin: 0;
    font-family: 'Open Sans', sans-serif;
  }

  h1 {
    color: whitesmoke;
    text-align: center;
    font-size: 60px;
    font-style: italic;
  }

  h2 {
    color: rgb(35, 71, 35);
    text-align: center;
    font-size: 40px;
    font-style: italic;
  }

  p {
    font-size: 25px;
    font-family: 'Open Sans', sans-serif;
  }

  .history-header {
    background-image: url('background-history.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 100px 20px;
    text-align: center;
  }

  .history-content {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

  .park-card {
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    padding: 25px;
    margin: 40px auto;
    width: 85%;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .park-card:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }

  .content-row, .park-heading, .acadia-heading {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .content-row img, .park-heading img, .acadia-heading img {
    width: 450px;
    height: 300px;
    border-radius: 10px;
    transition: transform 0.3s ease;
  }

  .content-row img:hover,
  .park-heading img:hover,
  .acadia-heading img:hover {
    transform: scale(1.05);
  }

  .btn-container {
    margin-top: 25px;
  }

  .explore-btn {
    display: inline-block;
    background-color: #1a4d2e;
    color: white;
    padding: 12px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
  }

  .explore-btn:hover {
    background-color: #ffd166;
    color: #1a4d2e;
    transform: scale(1.05);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  /* Responsive layout */
  @media (max-width: 900px) {
    .content-row, .park-heading, .acadia-heading {
      flex-direction: column;
    }

    .content-row img, .park-heading img, .acadia-heading img {
      width: 100%;
      height: auto;
    }
  }


/* Footer styling */
  footer {
    background-color: #0d2015;
    color: white;
    text-align: center;
    padding: 30px 10px;
    margin-top: 40px;
  }

  .social-links {
    margin-top: 15px;
  }

  .social-links a {
    color: white;
    font-size: 28px;
    margin: 0 15px;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .social-links a:hover {
    color: #ffd166;
    transform: scale(1.2);
  }

  .footer-text {
    font-size: 16px;
    margin-top: 15px;
    color: #bbb;
  }
</style>

    <!-- Footer with social media links -->
    <footer>
      <h3>Follow Us</h3>
      <div class="social-links">
        <a href="https://www.facebook.com" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="https://www.youtube.com" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://www.instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
      <div class="footer-text">
        © 2025 National Park Explorer | All Rights Reserved
      </div>
    </footer>

</body>
</html>
